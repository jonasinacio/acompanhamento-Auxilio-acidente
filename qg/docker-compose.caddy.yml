# ============================================================================
# QG atrás de um Caddy JÁ EXISTENTE (coexiste com outro app nas portas 80/443)
#   Sobe SÓ o banco + app. Quem faz HTTPS e roteia por domínio é o Caddy de fora
#   (o do chat-bullq). Use com:  bash deploy/qg-atras-do-caddy.sh
# ============================================================================
services:

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"   # só localhost do VPS (robôs SENTINELA gravam aqui)
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://${QG_HOST}"
    # SEM portas publicadas: o Caddy externo alcança via rede docker (qg-app-1:3000)

volumes:
  pgdata:
